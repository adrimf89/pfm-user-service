name: Build and Tag Docker Image

on:
  push:
    branches:
      - dev

jobs:
  build-and-tag:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Needed to create tags
      packages: write # Needed to push Docker images

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Tag with short commit SHA
        id: vars
        run: echo "SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

      - name: Build and push Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository }}:${{ env.SHORT_SHA }} .
          docker push ghcr.io/${{ github.repository }}:${{ env.SHORT_SHA }}

      - name: Create Git tag
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git tag ${{ env.SHORT_SHA }}
          git push origin ${{ env.SHORT_SHA }}
